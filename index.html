<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free African Shopping — handcrafted African fashion, art, home decor and beauty, shipped worldwide." />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Free African Shopping</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%231a1a1a'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='16'%20fill='%23d4af37'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    <script>
      // Prevents FOUC (flash of unstyled content) for dark mode. Tailwind is
      // compiled at build time now (see tailwind.config.js + postcss.config.js),
      // so only the theme toggle lives in this script.
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-brand-offwhite dark:bg-dark-bg transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
